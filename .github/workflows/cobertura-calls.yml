name: Cobertura de calls

# Cruza a agenda dos closers com o Meetrox e grava, por call, se foi gravada —
# e quando não foi, se o bot falhou ou o lead não apareceu.

on:
  schedule:
    # De 2 em 2 horas, 07:30 às 21:30 em São Paulo. A primeira é meia hora antes
    # da daily de propósito: o agendador do Actions atrasa quando a fila está
    # cheia. As demais existem pra aba Cobertura mostrar as calls do próprio dia
    # — com uma execução só, de manhã, ela sempre mostrava até o dia anterior.
    # A última, 21:30, pega as calls da noite, que é onde o no-show se concentra.
    # Cada execução reapura os últimos 3 dias, então call classificada depois que
    # a rotina passou entra na rodada seguinte.
    - cron: '30 10-23/2 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      de:
        description: 'Data inicial (AAAA-MM-DD) — vazio usa os últimos 3 dias'
        required: false
      ate:
        description: 'Data final (AAAA-MM-DD)'
        required: false

permissions:
  contents: read

jobs:
  cobertura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar google-auth
        run: pip install --quiet google-auth
      - name: Cruzar agenda x Meetrox
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GOOGLE_ADMIN_EMAIL: ${{ secrets.GOOGLE_ADMIN_EMAIL }}
          MEETROX_API_KEY: ${{ secrets.MEETROX_API_KEY }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DE: ${{ inputs.de }}
          ATE: ${{ inputs.ate }}
        run: python3 .github/scripts/cobertura_calls.py "$DE" "$ATE"
